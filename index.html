<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown</title>
    <script>
        function updateCountdown() {
            const endDate = new Date('2029-01-20T00:00:00Z');
            const currentDate = new Date('2026-04-01T04:30:06Z'); // Current date
            const totalSeconds = Math.floor((endDate - currentDate) / 1000);

            // Calculate years and days
            const years = Math.floor(totalSeconds / (365 * 24 * 60 * 60));
            const days = Math.floor((totalSeconds % (365 * 24 * 60 * 60)) / (24 * 60 * 60));

            const countdownDisplay = `${years} years and ${days} days`;
            document.getElementById('countdown').innerText = countdownDisplay;
        }

        setInterval(updateCountdown, 1000);
    </script>
</head>
<body onload="updateCountdown()">
    <h1>Countdown to January 20, 2029</h1>
    <div id="countdown"></div>
</body>
</html>
